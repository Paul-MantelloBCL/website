[build]
publish = "dist"
# Refresh the DNS-posture badge in public/ (best-effort: keeps prior badge if
# `dig` is missing in the build image), then run the normal Astro build.
command = "./scripts/netlify-hook.sh bluecollarlabs.org public && npm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
