[build]
publish = "dist"
# Prebuild hook (DNS-posture badge refresh) wraps `npm run build`. If the hook
# fails, Netlify still deploys the last-good badge that's checked into public/.
command = "bash ./scripts/netlify-hook.sh bluecollarlabs.org public || echo 'netlify-hook.sh failed (non-fatal)'; npm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
