<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="200" fill="#ffffff"/>
  
  <!-- Icon: Simple B -->
  <rect x="50" y="40" width="120" height="120" 
        fill="#1E40AF" 
        rx="10"/>
  <text x="110" y="125" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="80" 
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle">
    B
  </text>
  
  <!-- Main text: BLUECOLLAR LABS -->
  <text x="200" y="100" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="48" 
        font-weight="bold"
        fill="#1E40AF"
        letter-spacing="2">
    BLUECOLLAR
  </text>
  <text x="480" y="100" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="48" 
        font-weight="900"
        fill="#1E40AF"
        letter-spacing="4">
    LABS
  </text>
  
  <!-- Tagline -->
  <text x="200" y="140" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="18" 
        fill="#6B7280"
        letter-spacing="1">
    AI for the People Who Build America
  </text>
</svg>
