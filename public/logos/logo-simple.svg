<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Main text: BLUECOLLAR -->
  <text x="400" y="180" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="72" 
        font-weight="bold"
        fill="#1E40AF"
        text-anchor="middle"
        letter-spacing="4">
    BLUECOLLAR
  </text>
  
  <!-- Secondary text: LABS -->
  <text x="400" y="260" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="72" 
        font-weight="900"
        fill="#1E40AF"
        text-anchor="middle"
        letter-spacing="8">
    LABS
  </text>
  
  <!-- Divider line -->
  <line x1="200" y1="290" x2="600" y2="290" 
        stroke="#1E40AF" 
        stroke-width="3"/>
  
  <!-- Tagline -->
  <text x="400" y="330" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="24" 
        fill="#6B7280"
        text-anchor="middle"
        letter-spacing="1">
    AI for the People Who Build America
  </text>
</svg>
